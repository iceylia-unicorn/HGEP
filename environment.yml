# HGEP shared environment
# Usage:
#   conda env create -f environment.yml
#   conda activate HGEP
#
# Notes:
# - This file is based on the current HGEP runtime stack in this repo.
# - It targets Linux + CUDA 12.1.
# - If you only run CPU experiments, replace the CUDA-specific torch/DGL/PyG wheels.

name: HGEP
channels:
  - defaults
dependencies:
  - python=3.11
  - pip>=25
  - pyyaml=6.0.3
  - pip:
      # PyTorch 2.4 Linux wheels default to CUDA 12.1.
      - torch==2.4.0
      - torchvision==0.19.0
      - torchaudio==2.4.0

      # DGL for torch 2.4 + CUDA 12.1.
      - --find-links https://data.dgl.ai/wheels/torch-2.4/cu121/repo.html
      - dgl==2.4.0+cu121

      # PyG extensions for torch 2.4 + CUDA 12.1.
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cu121.html
      - pyg-lib==0.4.0+pt24cu121
      - torch-scatter==2.1.2+pt24cu121
      - torch-sparse==0.6.18+pt24cu121
      - torch-cluster==1.6.3+pt24cu121
      - torch-spline-conv==1.2.2+pt24cu121
      - torch-geometric==2.7.0

      # Project runtime deps used across HGEP / HGMP / HGPrompt scripts.
      - numpy==2.0.1
      - scipy==1.17.1
      - scikit-learn==1.8.0
      - networkx==3.6.1
      - tqdm==4.67.3
      - wandb==0.26.0
